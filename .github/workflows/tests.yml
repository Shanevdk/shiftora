name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Production runs on Laravel Cloud Serverless Postgres, so migrations are verified against Postgres too.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: shiftora
          POSTGRES_USER: shiftora
          POSTGRES_PASSWORD: shiftora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: shiftora
      DB_USERNAME: shiftora
      DB_PASSWORD: shiftora

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_pgsql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Seed demo data against Postgres
        run: php artisan db:seed --force

      - name: Audit dependencies
        run: composer audit

      - name: Run CI Checks
        run: composer ci:check
